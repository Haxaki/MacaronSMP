<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> — Macaron SMP</title>

    <link rel="stylesheet" href="French.css">
</head>

<body>

    <!-- =========================
         CYBER BACKGROUND
    ========================== -->

    <div class="cyber-background">
        <div class="scanline"></div>
    </div>


    <!-- =========================
         PROFILE
    ========================== -->

    <main class="profile">


        <!-- =====================
             LEFT — SKIN
        ====================== -->

        <section class="skin-section">

            <p class="section-label">
                PLAYER SKIN
            </p>

            <div class="skin-container">

                <canvas id="skin_container"></canvas>

            </div>

            <p class="skin-hint">
                DRAG TO ROTATE · SCROLL TO ZOOM
            </p>

        </section>


        <!-- =====================
             RIGHT — INFORMATION
        ====================== -->

        <section class="info-section">

            <p class="section-label">
                PLAYER PROFILE
            </p>


            <h1>
                Name: Frenchtoastego ( French )
            </h1>

            <!-- Player information -->

<div class="info-list">

    <div class="info-item">
        <span>KNOWN AS</span>
        <strong>French, Toast, Debase</strong>
    </div>

    <div class="info-item">
        <span>PRONOUNS</span>
        <strong>He / Him</strong>
    </div>

    <div class="info-item">
        <span>PLAYER TYPE</span>
        <strong>Pvper, Builder, Grinder, Redstoner</strong>
    </div>

    <div class="info-item">
        <span>JOINED</span>
        <strong>August 09, 2026</strong>
    </div>

    <div class="info-item">
        <span>STATUS</span>
        <strong class="status-active">Active</strong>
    </div>

</div>


            <!-- About -->

            <div class="about">

                <span>
                    ABOUT
                </span>

                <p>
                   :3
                </p>

            </div>


        </section>

    </main>


    <!-- =========================
         SKINVIEW3D
    ========================== -->

    <script src="https://unpkg.com/skinview3d@3.4.2/bundles/skinview3d.bundle.js"></script>

    <script src="Toast.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macaron SMP</title>

    <link rel="stylesheet" href="Suspect one.css">
</head>

<body>

    <!CYBERPUNK BACKGROUND >
    <div class="cyber-background">
        <div class="scanline"></div>
    </div>


    <!FIRST SCREEN >
    <section class="hero">

        <h1>MACARON SMP</h1>

        <div class="scroll-indicator">
        </div>

    </section>


    <! USERNAME SCREEN>
<section class="username-section">

    <div class="username-box" id="usernameBox">

        <p>IDENTIFICATION REQUIRED</p>

        <h2>Enter your username</h2>

        <input
            type="text"
            id="usernameInput"
            placeholder="Username..."
            autocomplete="off"
        >

    </div>


    <!LOADING SCREEN>
    <div class="loading-screen" id="loadingScreen">

        <div class="loader"></div>

        <p>CONNECTING...</p>

    </div>


    <!WELCOME SCREEN>
    <div class="welcome-screen" id="welcomeScreen">

        <p>IDENTIFICATION VERIFIED</p>

        <h2>Welcome, <span id="welcomeUsername"></span></h2>

    </div>

</section>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const input = document.getElementById("usernameInput");
    const usernameBox = document.getElementById("usernameBox");
    const loadingScreen = document.getElementById("loadingScreen");
    const welcomeScreen = document.getElementById("welcomeScreen");
    const welcomeUsername = document.getElementById("welcomeUsername");

    const players = {
        "rae":"./Rae.html",
        "macaron":"./Rae.html",
        "raeraemp3":"./Rae.html",
        "oculeaf":"./Oculeaf.html",
        "reveryn":"./Oculeaf.html",
        "rev":"./Oculeaf.html",
        "ai": "./AtelierIndustry.html",
        "atelierindustry": "./AtelierIndustry.html",
        "zeenah": "./AtelierIndustry.html",
        "jena": "./AtelierIndustry.html",
        "chrosl": "./AtelierIndustry.html",
        "kurogeo": "./KuroGeo.html",
        "epsilon": "./Epsilon.html",
        "qb": "./Epsilon.html",
        "qbisxm": "./Epsilon.html",
        "haxaki": "./Haxpage.html",
        "kiki": "./Haxpage.html",
        "haxaki hamane": "./Haxpage.html",
        "axorei": "./Axorei.html",
        "7vxltls": "./Axorei.html",
        "7vx": "./Axorei.html",
        "axo": "./Axorei.html",
        "axo": "./Axorei.html",
        "memory":"./Memory.html",
        "memo":"./Memory.html",
        "ryry":"./Memory.html",
        "re1_h1kar1" : "./Ren.html",
        "ren" : "./Ren.html",
        "rei" : "./Ren.html",
        "kari" : "./Ren.html",
        "hika" : "./Ren.html",
        "elijah":"./Elijah.html",
        "elijahwithmany0":"./Elijah.html",
        "french":"./FrenchToast.html",
        "toast":"./FrenchToast.html",
        "frenchtoast":"./FrenchToast.html",
        "debase":"./FrenchToast.html",
        "conquestorf":"./ConquestorF.html",
        "conq":"./ConquestorF.html",
        "con":"./ConquestorF.html",
        "itssmako": "./Mako.html",
        "mako":"./Mako.html",
        "issac":"./Mako.html",
        "craftedcone":"./CraftedCone.html",
        "cone":"./CraftedCone.html",
        "zee":"./Zee.html",
        "zeelizee":"./Zee.html",
    };

    input.addEventListener("keydown", function (event) {

        if (event.key !== "Enter") return;

        const username = input.value.trim();

        if (username === "") return;

        console.log("Username:", username);
        console.log("Destination:", players[username.toLowerCase()]);

        usernameBox.style.display = "none";
        loadingScreen.classList.add("active");

        setTimeout(function () {

            loadingScreen.classList.remove("active");

            welcomeUsername.textContent = username;
            welcomeScreen.classList.add("active");

            console.log("WELCOME SHOWN");

            setTimeout(function () {

                const player = players[username.toLowerCase()];

                if (player) {
                    console.log("Redirecting to:", player);
                    window.location.href = player;
                } else {
                    console.log("Player not found!");
                }

            }, 2000);

        }, 1200);

    });

});
</script>
</body>
</html>
